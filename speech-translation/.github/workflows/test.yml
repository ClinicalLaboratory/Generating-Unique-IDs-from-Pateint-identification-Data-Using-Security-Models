name: Test Configuration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-config:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyYAML
        
    - name: Run configuration tests
      run: python3 test-config.py
      
    - name: Validate Docker Compose
      run: |
        # Install Docker Compose
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.21.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        
        # Validate configuration
        docker-compose config --quiet
        
    - name: Test shell scripts syntax
      run: |
        bash -n start.sh
        bash -n stop.sh
        bash -n init-workflow.sh
        
    - name: Validate JSON files
      run: |
        python3 -m json.tool n8n/workflow_speech_translate.json > /dev/null
        echo "✅ n8n workflow JSON is valid"
        
    - name: Check file permissions
      run: |
        test -x start.sh || (echo "❌ start.sh not executable" && exit 1)
        test -x stop.sh || (echo "❌ stop.sh not executable" && exit 1)
        test -x init-workflow.sh || (echo "❌ init-workflow.sh not executable" && exit 1)
        test -x test-config.py || (echo "❌ test-config.py not executable" && exit 1)
        echo "✅ All scripts are executable"

  test-docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Whisper service image
      run: |
        docker build -f Dockerfile.whisper -t speech-translation-whisper .
        
    - name: Build Web interface image
      run: |
        docker build -f Dockerfile.web -t speech-translation-web .
        
    - name: Test Docker Compose
      run: |
        # Test that compose file can be parsed and services defined
        docker-compose config --services | grep -q "n8n"
        docker-compose config --services | grep -q "whisper-service"
        docker-compose config --services | grep -q "web-interface"
        echo "✅ All services defined in docker-compose.yml"

  lint-code:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
        
    - name: Lint Python code
      run: |
        # Check Python syntax and style
        flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Check Python formatting
      run: |
        black --check --diff scripts/
        
    - name: Lint JavaScript
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - run: |
        npx jshint web/app.js || echo "⚠️ JavaScript linting warnings (non-blocking)"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'